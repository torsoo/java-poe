name: TestJava

# runs the unit tests every time code is pushed or a pull request is opened
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JUnit 4
        run: |
          mkdir -p ci-lib
          curl -sSL -o ci-lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o ci-lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile the code and the tests
        run: |
          mkdir -p out
          javac -encoding UTF-8 -cp "lib/json-simple-1.1.jar:ci-lib/*" -d out src/chat/*.java test/TestClasses/*.java

      - name: Run the unit tests
        run: java -cp "out:lib/json-simple-1.1.jar:ci-lib/*" org.junit.runner.JUnitCore TestClasses.MessageTest TestClasses.TestCode
